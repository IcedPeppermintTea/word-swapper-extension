<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings — WordSwapper</title>
    <link rel="stylesheet" href="css/global-styles.css">
    <link rel="stylesheet" href="css/settings.css">
</head>

<body>
    <div class="settings-page">

        <header class="settings-header">
            <h1>Word <span class="gradient-text">Swapper</span> Settings</h1>
            <p>Manage what gets swapped on every page you visit.</p>
        </header>

        <!-- Add New Rule -->
        <section class="panel">
            <h2>Add new rule</h2>

            <div class="new-rule-section">
                <div class="new-rule-fields">
                    <div class="field">
                        <label for="given_word">Word to be swapped</label>
                        <input type="text" id="given_word" placeholder="e.g. moist" required>
                    </div>
                    <div class="field">
                        <label for="swap_value">Word to swap to</label>
                        <input type="text" id="swap_value" placeholder="e.g. damp" required>
                    </div>
                </div>

                <div class="new-field-options">
                    <label class="checkbox-option">
                        <input type="checkbox" id="full-word">
                        <span>Full word only</span>
                    </label>
                    <label class="checkbox-option">
                        <input type="checkbox" id="case-sensitive">
                        <span>Case sensitive</span>
                    </label>
                </div>

                <button type="button" id="save" class="btn-primary">Save rule</button>
            </div>
        </section>

        <!-- Existing Rules -->
        <section class="panel">
            <div class="panel-header-row">
                <h2>Existing rules</h2>
                <span class="rule-count" id="rule-count">0 rules</span>
            </div>

            <!-- Empty state: show/hide when rules.length === 0 -->
            <div class="empty-state" id="empty-state">
                <p>No rules yet — add one above to get started.</p>
            </div>

            <div class="existing-rules-section" id="rules-list">


                <!-- Rules will be dynamically displayed here  -->
            </div>
        </section>

    </div>

    <script src="js/settings.js"></script>
</body>

</html>
