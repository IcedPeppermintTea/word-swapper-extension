<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
</head>

<body>
    <h1>Word Swapper Settings</h1>

    <!--Add New Rule-->
    <section>
        <h2>Add New Rule:</h2>

        <div class="new-rule-section">
            <div class="new-rule-fields">
                <label>Word to be Swapped:</label>
                <input type="text" id="given_word" placeholder="word to swap">
                <label>Word to Swap To:</label>
                <input type=text id="swap_value" placeholder="swap value">
            </div>
            <div class="new-field-options">
                <div>
                    <input type="checkbox" id="full-word" name="full-word">
                    <label for="full-word">Full word only</label>
                </div>
                <div>
                    <input type="checkbox" id="case-sensitive" name="case-sensitive">
                    <label for="full-word">Case sensitive search</label>
                </div>
                
            </div>

            <button type="button" id="save">Save</button>
        </div>
    </section>

    <!--Add/Remove New Settings-->

</body>

<script src="js/settings.js"></script>

</html>
